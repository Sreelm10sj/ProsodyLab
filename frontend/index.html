<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProsodyLab — Speech Prosody Analysis</title>
    <meta name="description" content="A research instrument for acoustic phonetics. Record or upload speech to analyze stress, intonation, pauses, and pitch contour with phoneme-level precision." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      DM Sans: weights 300–800 for all body/UI and display text.
      IBM Plex Mono: 400 + 600 italic for all monospace/data labels.
    -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          if (!localStorage.getItem('prosodylab_theme_v2_default')) {
            localStorage.setItem('prosodylab_theme_v2_default', '1');
            localStorage.setItem('prosodylab_theme', 'light');
          }
          if (localStorage.getItem('prosodylab_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
